apiVersion: apps/v1
kind: Deployment
metadata:
 name: enterprise-app-deployment
 namespace: enterprise-app
spec:
 replicas: 3
 selector:
  matchLabels:
   app: enterprise-app
 template:
  metadata:
   labels:
    app: enterprise-app
  spec:
    containers:
    - name: enterprise-app
      image: ghcr.io/2003vinay/kubernetes-enterprise-deployment:latest
      ports:
       - containerPort: 5000
      envFrom:
       - configMapRef:
           name: enterprise-app-config
       - secretRef:
           name: enterprise-app-secret
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"