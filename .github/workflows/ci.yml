name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        env:
         PYTHONPATH: .

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/2003vinay/kubernetes-enterprise-deployment:${{ github.sha }} \
            -t ghcr.io/2003vinay/kubernetes-enterprise-deployment:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/2003vinay/kubernetes-enterprise-deployment:${{ github.sha }}
          docker push ghcr.io/2003vinay/kubernetes-enterprise-deployment:latest
