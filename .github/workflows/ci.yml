name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        env:
         PYTHONPATH: .

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/2003vinay/kubernetes-enterprise-deployment:${{ github.sha }} \
            -t ghcr.io/2003vinay/kubernetes-enterprise-deployment:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/2003vinay/kubernetes-enterprise-deployment:${{ github.sha }}
          docker push ghcr.io/2003vinay/kubernetes-enterprise-deployment:latest
  
  deploy:
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Deploy commit image
        run: kubectl set image deployment/enterprise-app-deployment enterprise-app=ghcr.io/2003vinay/kubernetes-enterprise-deployment:${{ github.sha }} -n enterprise-app

      - name: Wait for rollout
        run: kubectl rollout status deployment/enterprise-app-deployment -n enterprise-app --timeout=300s

      - name: Verify deployment
        run: kubectl get pods -n enterprise-app